services:

  postgres:
    image: postgres:16
    container_name: fintech-postgres
    restart: unless-stopped

    networks:
      - fintech-network

    environment:
      POSTGRES_DB: ${DB_NAME:-fintech}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}

    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fintech-redis
    restart: unless-stopped

    networks:
      - fintech-network

    ports:
      - "${REDIS_PORT:-6379}:6379"

    command: redis-server --requirepass ${REDIS_PASSWORD} /usr/local/etc/redis/redis.conf

    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: fintech-jaeger
    restart: unless-stopped

    networks:
      - fintech-network

    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
      - "14268:14268"

  prometheus:
    image: prom/prometheus:latest
    container_name: fintech-prometheus
    restart: unless-stopped

    networks:
      - fintech-network

    ports:
      - "9090:9090"

    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: fintech-grafana
    restart: unless-stopped

    networks:
      - fintech-network

    ports:
      - "3001:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    container_name: fintech-elasticsearch
    restart: unless-stopped

    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

    networks:
      - fintech-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.3
    container_name: fintech-logstash
    restart: unless-stopped

    ports:
      - "5000:5000"

    volumes:
      - ./docker/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro

    depends_on:
      - elasticsearch

    networks:
      - fintech-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.3
    container_name: fintech-kibana
    restart: unless-stopped

    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200

    ports:
      - "5601:5601"

    depends_on:
      - elasticsearch

    networks:
      - fintech-network

  app:
    profiles:
      - app

    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: fintech-app

    restart: unless-stopped

    networks:
      - fintech-network

    ports:
      - "${APP_PORT:-3000}:3000"

    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-fintech}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: debug
      LOGSTASH_HOST: logstash

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      elasticsearch:
        condition: service_started

      logstash:
        condition: service_started

    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - /app/node_modules

networks:
  fintech-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  grafana_data:
  elasticsearch_data: