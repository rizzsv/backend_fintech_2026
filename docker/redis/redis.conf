# ===== Memory =====
maxmemory 256mb
maxmemory-policy allkeys-lru

# ===== Persistence =====
# Disable RDB for development (comment out for persistence)
# save 900 1
# save 300 10
# save 60 10000

# ===== Append Only File (AOF) =====
appendonly no

# ===== Logging =====
loglevel notice
logfile ""

# ===== Performance =====
databases 16
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ===== Command renaming (optional) =====
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""

client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Redis eviction policy
maxmemory-policy noeviction

bind 0.0.0.0
protected-mode yes

requirepass superRedis2026

appendonly yes