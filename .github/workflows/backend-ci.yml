name: Fintech Backend CI

on:
  push:
    branches:
      - main
      - Development

  pull_request:
    branches:
      - main
      - Development

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fintech_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      NODE_ENV: "test"
      APP_PORT: "3000"

      DB_HOST: "localhost"
      DB_PORT: "5432"
      DB_NAME: "fintech_test"
      DB_USER: "postgres"
      DB_PASSWORD: "postgres"

      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/fintech_test"

      REDIS_HOST: "localhost"
      REDIS_PORT: "6379"

      JWT_SECRET: "testing-secret"
      REFRESH_TOKEN_SECRET: "testing-refresh-secret"

      APP_URL: "http://localhost:3000"

      LOG_LEVEL: "silent"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Database Migration
        run: npx prisma migrate deploy

      - name: Build Project
        run: npm run build